<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 3840" width="3840" height="3840">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="45%" stop-color="#121a2e"/>
      <stop offset="100%" stop-color="#1a0a28"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#6b7cff" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#ff3dff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ring" cx="50%" cy="42%" r="48%">
      <stop offset="82%" stop-color="#ffd54a" stop-opacity="0"/>
      <stop offset="88%" stop-color="#00f0ff" stop-opacity="0.85"/>
      <stop offset="94%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff3dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="3840" height="3840" fill="url(#bg)"/>
  <circle cx="1920" cy="1580" r="1280" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="1920" cy="1580" r="1180" fill="none" stroke="url(#ring)" stroke-width="8"/>
  <ellipse cx="1920" cy="1280" rx="420" ry="180" fill="#ffffff" opacity="0.22"/>
  <text x="1920" y="3180" text-anchor="middle" fill="#a5f3fc" font-family="Tahoma,sans-serif" font-size="72" opacity="0.45">AERO SPHERE  4K PRINT</text>
</svg>
